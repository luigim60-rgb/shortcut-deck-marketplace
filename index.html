<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shortcut Deck Marketplace</title>
    <style>
      :root {
        color: #f7fbff;
        background: #07090d;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 720px);
        display: grid;
        gap: 14px;
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        font-size: clamp(2rem, 8vw, 4rem);
        line-height: 1;
      }

      p,
      a {
        color: #aebccc;
        font-weight: 700;
        line-height: 1.45;
      }

      a {
        color: #7fd7ff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Shortcut Deck Marketplace</h1>
      <p>Catalogo statico per pacchetti modulo firmati.</p>
      <p><a href="./catalog.json">Apri catalog.json</a></p>
    </main>
  </body>
</html>
